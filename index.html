<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>

    <!-- tailwind+dasyUI -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link rel="stylesheet" href="./CSS/style.css">

     <!-- font style -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

     <!-- font awsome -->
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <section class="min-h-screen max-w-md mx-auto text-center mt-10 ">
        <div class="w-11/12 mx-auto shadow-xl block pt-10 pb-5 space-y-2 px-4" >
            <div class="logo w-[100px] mx-auto">
                <img src="./assets/github-logo.png" alt="">
            </div>
            <h2>GitHub Issues Tracker</h2>
            <p>Sign in to manage your issues</p>
            <div class="mx-auto flex justify-center">
                <fieldset class="fieldset rounded-box w-xs  p-4">
                <label class="label">Username</label>
                <input type="text" class="input" placeholder="Email" id="user-value" />
                <h4 class="text-left text-blue-500">Default: admin</h4>
                <label class="label">Password</label>
                <input type="password" class="input" placeholder="Password" id="user-pass" />
                <h4 class="text-left text-blue-500">Default: admin123</h4>
                <button id="btn-loggin" class="btn text-cyan-50 bg-primary mt-4">Sign In</button>
                </fieldset>
            </div>
            <div class="divider">OR</div>
            <h3 class="text-[10px]">Demo Credentials:</h3>

            <div>
                <h5>Username: admin</h5>
                <h5>Password: admin123</h5>
            </div>
        </div>

    </section>


    <script src="./JS/login.js"></script>
</body>
</html>
